name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The optional deep-learning extra is installed deliberately: the suite covers
      # the neural and graph models, and a green run that silently skipped them would
      # be worse than no run at all.
      - run: pip install -e ".[dev,nn]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest
