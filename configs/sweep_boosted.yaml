# Stage 2: tune the boosted tree, which is the strongest model measured so far
# (macro ST-RAE 0.6785 against 0.7533 for the next best).
#
#   wandb sweep configs/sweep_boosted.yaml
#
# Run this only after stage 1 says the boosted tree wins. If a different family wins,
# tune that one instead -- these parameters are read by nobody else.
program: scripts/run_experiment.py
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--track"
  - ${args}
method: bayes
metric:
  name: holdout/MA_ST-RAE
  goal: minimize

parameters:
  model.kind:
    value: boosted

  model.boosted.num_leaves:
    values: [31, 63, 127]
  model.boosted.n_estimators:
    values: [400, 800, 1600]
  model.boosted.learning_rate:
    distribution: log_uniform_values
    min: 0.01
    max: 0.2

  # Fingerprint width. Uniform scaling across a sparse fingerprint and a dense
  # descriptor block was measured to cost 0.089, so the block scaler stays on.
  features.fingerprint_bits:
    values: [1024, 2048, 4096]
  features.fingerprint_radius:
    values: [2, 3]

  # Append Boltz-2 cofold features (affinity + heme-coordination pose). Needs a
  # precomputed cofold cache (scripts/cofold_structures.py); with no cache the block is
  # all-NaN, which a tree tolerates, so "true" is only meaningful once the cache exists.
  sources.structure:
    values: [false, true]

  # The surrogate strategies belong here rather than in stage one, because they apply
  # only to a model that predicts a scalar pIC50 and so cannot consume a response
  # measurement directly. They fit a model to the screen and pass its output, or its
  # hidden layer, in as input columns -- a way of using the cheap data without letting
  # its 17,504 readings outvote 6,325 dose-response labels. The curve model needs none
  # of this: the screen is already a point on the curve it predicts.
  sources.screen:
    values: [true, false]
  # How the screen is folded in (the strategy axis) is swept in configs/sweep_sources.yaml,
  # kept out of the hyperparameter grid here to keep it legible.

  data.holdout_fraction:
    value: 0.2

early_terminate:
  type: hyperband
  min_iter: 3
