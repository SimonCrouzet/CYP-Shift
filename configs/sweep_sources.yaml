# Stage: which evidence sources to use, and how the screen is folded in.
#
#   wandb sweep configs/sweep_sources.yaml
#
# Sources are independent yes/no switches (sources.*); the screen's *how* is the one
# strategy knob that belongs with them. Fixed to the boosted tree; re-point model.kind
# if another family wins stage one. Auxiliary data (chembl/sair/octant/veith, on one
# distance axis) has its own stage in configs/sweep_auxiliary.yaml.
program: scripts/run_experiment.py
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--track"
  - ${args}
method: bayes
metric:
  name: holdout/MA_ST-RAE
  goal: minimize

parameters:
  model.kind:
    value: boosted

  sources.screen:
    values: [true, false]
  multifidelity.screen_strategy:
    values: [extra_rows, predicted_label, embedding]
  multifidelity.screen_weight:
    distribution: uniform
    min: 0.05
    max: 1.0
  sources.structure:
    values: [false, true]

  data.holdout_fraction:
    value: 0.2

early_terminate:
  type: hyperband
  min_iter: 3
