# Stage 2 (neural): tune the neural model, including how it conditions.
#
#   wandb sweep configs/sweep_neural.yaml
#
# Run this when stage one picks the neural family. It is the only family that can use
# the embedding conditioning strategy -- a learned (target, assay) table -- so that knob
# and its width live here rather than in the shared stage-one sweep, where a boosted or
# graph trial cannot honour it.
program: scripts/run_experiment.py
method: bayes
metric:
  name: holdout/MA_ST-RAE
  goal: minimize

parameters:
  model.kind:
    value: neural

  # factorised and metadata are one-hot input encodings; embedding looks the condition
  # up in a learned table instead. Whether the table beats the one-hot is the question.
  # Every strategy the neural model implements: one-hot inputs (factorised, metadata),
  # a learned table (embedding), the pocket vector (descriptor), per-condition output
  # heads (heads), and descriptor-driven trunk modulation (film).
  conditioning.strategy:
    values: [factorised, metadata, embedding, descriptor, heads, film, calibration]
  # Only read when conditioning.strategy is embedding: the width of that table.
  conditioning.embedding_dim:
    values: [4, 8, 16]
  # Only read for descriptor/film: which pocket-descriptor sources build the vector.
  conditioning.descriptor_sources:
    values:
      - [curated]
      - [curated, zscales]
      - [ctd]

  model.neural.hidden:
    values: [128, 256, 512]
  model.neural.dropout:
    values: [0.1, 0.3]
  model.neural.learning_rate:
    distribution: log_uniform_values
    min: 0.0003
    max: 0.005

  data.holdout_fraction:
    value: 0.2

early_terminate:
  type: hyperband
  min_iter: 3
