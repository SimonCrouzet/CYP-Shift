# Stage 1: which model family and training objective, before tuning anything.
#
#   wandb sweep configs/sweep.yaml
#
# Three staged sweeps rather than one, because most parameters are conditional and a
# joint sweep spends its budget on combinations that do not differ. model.boosted.*
# means nothing when the model is the curve, and model.curve.* means nothing when it is
# the boosted tree; sweeping them together made 46,656 grid points, most of them
# duplicates of each other under a different name.
#
#   1. this file                        pick the family and objective       48 points
#   2. configs/sweep_boosted.yaml       tune whichever family wins          18 points
#   3. configs/sweep_conditioning.yaml  the conditioning questions          96 points
#
# Bayesian rather than grid throughout, so a stage need not exhaust its space.
program: scripts/run_experiment.py
method: bayes
metric:
  name: holdout/MA_ST-RAE
  goal: minimize

parameters:
  model.kind:
    values: [boosted, neural, graph, curve]

  # Training on the ranked metric rather than on squared error. Worth 13x for the
  # underfit neural network and nothing for boosted trees, where it measured -0.0026 at
  # p=0.421 -- so this axis interacts with model.kind and belongs in the same stage.
  model.objective:
    values: [squared, absolute, soft_threshold]

  # How the assay condition enters. No head-to-head comparison exists in molecular
  # property prediction, so it is measured rather than assumed.
  conditioning.strategy:
    values: [factorised, metadata]

  # Whether the cheap single-concentration screen is used at all. Only the two
  # strategies every model family supports are swept here, because what "extra_rows"
  # means differs by family and the surrogate strategies do not apply to all of them.
  # For the curve model the screen enters as what it measured -- inhibition at
  # 4.95e-5 M, a point on the curve being predicted, with nothing fitted in between.
  # For a model predicting a scalar pIC50 the same reading has to be calibrated onto
  # that scale first. The surrogate strategies are swept in configs/sweep_boosted.yaml,
  # where they apply.
  sources.screen:
    values: [true, false]
  multifidelity.screen_weight:
    distribution: uniform
    min: 0.05
    max: 1.0

  # Which molecular feature blocks to include. These are real, wired knobs (featurise
  # reads them and the neural/curve scaler follows the changed block widths); the sweep
  # decides whether each block earns its place rather than it being fixed by hand.
  features.use_physicochemical:
    values: [true, false]
  features.use_mechanistic:
    values: [true, false]

  data.holdout_fraction:
    value: 0.2

early_terminate:
  type: hyperband
  min_iter: 3
