[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cypshift"
version = "0.1.0"
description = "Cytochrome P450 inhibition prediction under an interval-censored loss"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "rdkit>=2024.3.1",
    "scikit-learn>=1.4",
    "lightgbm>=4.5",
    "dimorphite-dl>=2.1",
    "scipy>=1.11",
    "typer>=0.12",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Runtime extras, so a user who only wants the boosted model need not install torch.
nn = ["torch>=2.2", "chemprop>=2.3"]
# Tabular foundation model backend (TabPFN-2.5), used as a per-endpoint blend member.
tfm = ["tabpfn>=9.2"]
analysis = ["matplotlib>=3.8", "seaborn>=0.13"]
track = ["wandb>=0.17"]
# Lightning AI SDK, used only by scripts/lightning_run.py to launch the sweep on a Studio GPU.
# Not in `dev`: it is a local orchestration tool, imported lazily, and not exercised by the suite.
cloud = ["lightning-sdk>=0.1"]
# Modal SDK, used only by scripts/modal_run.py (the alternative to Lightning when its API is not
# reachable). Same status as `cloud`: local orchestration, imported lazily, not in `dev`.
modal = ["modal>=1.0"]

# The developer install pulls in every runtime extra, because the test suite covers
# all of them. A `dev` install that cannot collect the tests is not a dev install.
dev = [
    "cypshift[nn,tfm,analysis,track]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
cypshift = "cypshift.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cypshift"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# Vendored verbatim from the challenge's own scorer; reformatting would break the
# claim that it is an unmodified copy.
"tests/reference/*" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
